experimento: exp_002_sarima_sutil
cultivo: SUTIL
modelo: SARIMA
descripcion: GC1 univariado (solo serie de produccion propia, sin regresores externos)
seleccion_metodo: top-5 candidatos por AIC en train, seleccion final por menor MAE
  en val (NO reentrenamiento con val, solo evaluacion de candidatos ya ajustados).
  Test tocado una unica vez con el modelo ganador.
estado: ejecutado
datos:
  entrada: master_dataset_sutil_v2.csv
  fuente: Midagri (produccion_t)
  unidades: toneladas (serie cruda, sin StandardScaler)
  n_filas: 120
  rango: 2016-01..2025-12
  nulos: 0
split:
  train:
    rango: 2016-07..2023-12
    meses: 90
  val:
    rango: 2024-01..2024-12
    meses: 12
  test:
    rango: 2025-01..2025-12
    meses: 12
shock:
  definicion: '|100*(y_t - y_{t-1})/y_{t-1}| > P75'
  escala: serie real en toneladas (NUNCA z-score)
  umbral_p75_pct: 23.2
  sobre: TEST unicamente
delta_s:
  formula: (MAE_shock - MAE_global) / MAE_global * 100
  observacion: deterioro relativo del modelo en meses de shock vs todo el test
modelo_ganador:
  order: (1,1,3)(2,1,0,12)
  aic_train: 1874.93
  mae_val: 8439.79
entorno:
  python: '3.11'
  seed: 42
  fecha_ejecucion: 2026-09-01 22:41
